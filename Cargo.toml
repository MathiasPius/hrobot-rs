[package]
name = "hrobot"
description = "Unofficial Hetzner Robot API client"
keywords = ["hetzner", "robot", "api", "client", "async"]
repository = "https://github.com/MathiasPius/hrobot-rs"
version = "7.0.0"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "hrobot"
path = "src/bin/main.rs"

[dependencies]
# CLI dependencies (only compiled for the binary)
clap = { version = "4.5", features = ["derive", "env"], optional = true }
clap_complete = { version = "4.5", optional = true }
tabled = { version = "0.16", optional = true }
tokio = { version = "1.29.1", features = ["macros", "rt-multi-thread"], optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "5.0", optional = true }
shellexpand = { version = "3.1", optional = true }
rpassword = { version = "7.3", optional = true }
tracing-subscriber = { version = "0.3.17", optional = true }

# Existing library dependencies
tracing = "0.1.37"
thiserror = "2.0.11"

ipnet = { version = "2.8.0", features = ["serde"] }
time = { version = "0.3.23", features = [
    "serde-human-readable",
    "macros",
    "parsing",
] }
time-tz = { version = "2.0.0" }
bytesize = { version = "2.2.0", features = ["serde"] }
rust_decimal = { version = "1.30.0", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.2.2"

base64 = "0.22.0"
urlencoding = "2"

hyper = { version = "1.2.0", features = ["http1", "client"] }
hyper-rustls = { version = "0.27.0", default-features = false, features = [
    "http1",
    "webpki-tokio",
    "ring",
] }
hyper-util = { version = "0.1.3", features = [
    "client",
    "client-legacy",
    "http1",
] }
http-body-util = "0.1.0"

[features]
default = []
cli = ["clap", "clap_complete", "tabled", "tokio", "toml", "dirs", "shellexpand", "rpassword", "tracing-subscriber"]

[dev-dependencies]
rand = "0.9.0"
tracing-subscriber = "0.3.17"
tracing-test = { version = "0.2.4", features = ["no-env-filter"] }

tokio = { version = "1.29.1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
serial_test = { version = "3.0.0", features = ["file_locks"] }


[features]
# This is only ever used during testing to order/cancel servers as part of the test procedure.
_tests_order_servers = []
